name: Terraform CI/CD pipeline

on: 
  push:
    branches:
      - awsdev/task-2

    pull_request: 
      branches:
        - awsdev/task-2 # run when had pr on this branch

jobs: 
  terraform:
    name: Terraform Job
    runs-on: ubuntu-latest
    steps:
      # Step 1: check code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with: 
          terraform_version: latest

      # Step 3:
      - name: Terraform Init
        run: terraform init

      # Step 4:
      - name: Terraform Plan
        run: terraform plan

      # Step 5:
      - name: Terraform Apply
        run: terraform apply -auto-approve

