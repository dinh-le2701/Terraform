name: Terraform CI/CD pipeline

on: 
  push:
    branches:

jobs: 
  terraform:
    name: Terraform Job
    steps:
      # Step 1: check code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with: 
          terraform_version: latest

      # Step 3:
      - name: Terraform Init
        run: terraform init

      # Step 4:
      - name: Terraform Plan
        run: terraform plan

      # Step 5:
      - name: Terraform Apply
        run: terraform apply

